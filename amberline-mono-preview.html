<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base16 Theme Preview: Amberline Mono</title>
    <style>
        :root {
            --base00: #140A02; --base01: #241204; --base02: #3A1E08; --base03: #64380F;
            --base04: #96591B; --base05: #D99237; --base06: #F2B45A; --base07: #FFE6B8;
            --base08: #B86A21; --base09: #C97929; --base0A: #D99237; --base0B: #E8A64A;
            --base0C: #F0B65E; --base0D: #F6C777; --base0E: #FFD99A; --base0F: #FFE6B8;
        }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; padding: 48px 20px; background: var(--base00); color: var(--base05); font-family: "Fira Code", "Cascadia Code", Consolas, monospace; }
        main { width: min(920px, 100%); margin: 0 auto; }
        h1 { margin: 0 0 24px; color: var(--base0E); font-weight: 400; text-align: center; }
        .swatches { display: grid; grid-template-columns: repeat(8, minmax(72px, 1fr)); gap: 10px; margin-bottom: 24px; }
        .swatch { min-height: 72px; border: 1px solid var(--base02); border-radius: 8px; padding: 9px; color: var(--base00); display: flex; align-items: end; justify-content: space-between; gap: 6px; font-size: 12px; }
        .window { overflow: hidden; border: 1px solid var(--base02); border-radius: 12px; background: var(--base00); box-shadow: 0 24px 60px rgba(0, 0, 0, .38), 0 0 34px rgba(240, 182, 94, .08); }
        .titlebar { display: flex; gap: 8px; padding: 12px 18px; background: var(--base01); border-bottom: 1px solid var(--base02); }
        .dot { width: 13px; height: 13px; border-radius: 50%; } .close { background: var(--base08); } .min { background: var(--base0A); } .max { background: var(--base0B); }
        pre { margin: 0; padding: 24px; overflow-x: auto; font-size: 15px; line-height: 1.65; }
        .keyword { color: var(--base0E); font-weight: 700; } .function { color: var(--base0D); } .string { color: var(--base0B); }
        .number { color: var(--base09); } .comment { color: var(--base03); font-style: italic; } .class { color: var(--base0A); }
        .property, .variable { color: var(--base08); } .regex { color: var(--base0C); } .operator { color: var(--base05); } .deprecated { color: var(--base0F); text-decoration: line-through; }
        @media (max-width: 720px) { body { padding: 30px 14px; } .swatches { grid-template-columns: repeat(4, minmax(64px, 1fr)); } pre { font-size: 13px; } }
    </style>
</head>
<body>
    <main>
        <h1>Amberline Mono</h1>
        <div class="swatches" id="swatches"></div>
        <div class="window">
            <div class="titlebar"><div class="dot close"></div><div class="dot min"></div><div class="dot max"></div></div>
            <pre><code><span class="comment"># Amberline Mono - one orange signal</span>
<span class="keyword">class</span> <span class="class">Signal</span>:
    <span class="keyword">def</span> <span class="function">warm</span>(self, level: <span class="class">int</span> = <span class="number">72</span>):
        self.<span class="property">level</span> = level
        token = <span class="regex">r"^amber_[0-9]+$"</span>
        <span class="keyword">return</span> <span class="string">f"glow {level}"</span></code></pre>
        </div>
    </main>
    <script>
        const names = ["00","01","02","03","04","05","06","07","08","09","0A","0B","0C","0D","0E","0F"];
        document.getElementById("swatches").innerHTML = names.map(name => {
            const value = getComputedStyle(document.documentElement).getPropertyValue(`--base${name}`).trim();
            return `<div class="swatch" style="background:${value}"><strong>base${name}</strong><span>${value.toUpperCase()}</span></div>`;
        }).join("");
    </script>
</body>
</html>
